<text x="800" y="513" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#1a1a1a">NEED</text>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="84" y="170" font-size="26" font-weight="650">NEGATIVE TRENDS</text><circle cx="92" cy="200" r="3.5" fill="#111827"/><text x="104" y="205" font-size="16.4" fill="#1b2931"><tspan x="104" dy="0">Sources de données dispersées</tspan></text><circle cx="92" cy="229" r="3.5" fill="#111827"/><text x="104" y="234" font-size="16.4" fill="#1b2931"><tspan x="104" dy="0">Rapprochements financiers manuels</tspan></text><circle cx="92" cy="258" r="3.5" fill="#111827"/><text x="104" y="263" font-size="16.4" fill="#1b2931"><tspan x="104" dy="0">Écarts parfois identifiés</tspan><tspan x="104" dy="20.5">tardivement</tspan></text>
<text x="1280" y="169" font-size="26" font-weight="650">POSITIVE TRENDS</text><circle cx="1320" cy="200" r="3.5" fill="#111827"/><text x="1332" y="205" font-size="16.4" fill="#1b2931"><tspan x="1332" dy="0">Indicateurs financiers</tspan><tspan x="1332" dy="20.5">consolidés</tspan></text><circle cx="1320" cy="249.5" r="3.5" fill="#111827"/><text x="1332" y="254.5" font-size="16.4" fill="#1b2931"><tspan x="1332" dy="0">Définitions de KPI</tspan><tspan x="1332" dy="20.5">harmonisées</tspan></text><circle cx="1320" cy="299" r="3.5" fill="#111827"/><text x="1332" y="304" font-size="16.4" fill="#1b2931"><tspan x="1332" dy="0">Comparaisons budgétaires</tspan><tspan x="1332" dy="20.5">plus lisibles</tspan></text>
<text x="84" y="521" font-size="26" font-weight="650">HEADACHES</text><circle cx="92" cy="550" r="3.5" fill="#111827"/><text x="104" y="555" font-size="16.4" fill="#1b2931"><tspan x="104" dy="0">Rapprocher réalisé et budget</tspan></text><circle cx="92" cy="578" r="3.5" fill="#111827"/><text x="104" y="583" font-size="16.4" fill="#1b2931"><tspan x="104" dy="0">Préparer les reportings</tspan></text><circle cx="92" cy="606" r="3.5" fill="#111827"/><text x="104" y="611" font-size="16.4" fill="#1b2931"><tspan x="104" dy="0">Expliquer les écarts à la</tspan><tspan x="104" dy="20.5">direction</tspan></text>
<text x="1321" y="522" font-size="25" font-weight="650">OPPORTUNITIES</text><circle cx="1115" cy="550" r="3.5" fill="#111827"/><text x="1127" y="555" font-size="16.4" fill="#1b2931"><tspan x="1127" dy="0">Vue consolidée des résultats</tspan></text><circle cx="1115" cy="578" r="3.5" fill="#111827"/><text x="1127" y="583" font-size="16.4" fill="#1b2931"><tspan x="1127" dy="0">Comparaison réalisé / budget</tspan></text><circle cx="1115" cy="606" r="3.5" fill="#111827"/><text x="1127" y="611" font-size="16.4" fill="#1b2931"><tspan x="1127" dy="0">Alertes explicables sur les écarts</tspan></text>
<text x="84" y="734" font-size="26" font-weight="650">FEARS</text><circle cx="91" cy="756" r="3.5" fill="#111827"/><text x="103" y="761" font-size="14.3" fill="#1b2931"><tspan x="103" dy="0">Décider à partir de données</tspan><tspan x="103" dy="17.875">incomplètes</tspan></text><circle cx="91" cy="796.875" r="3.5" fill="#111827"/><text x="103" y="801.875" font-size="14.3" fill="#1b2931"><tspan x="103" dy="0">Présenter des chiffres</tspan><tspan x="103" dy="17.875">incohérents</tspan></text><circle cx="91" cy="837.75" r="3.5" fill="#111827"/><text x="103" y="842.75" font-size="14.3" fill="#1b2931"><tspan x="103" dy="0">Manquer un écart important</tspan></text>
<text x="1410" y="735" font-size="26" font-weight="650">HOPES</text><circle cx="1104" cy="756" r="3.5" fill="#111827"/><text x="1116" y="761" font-size="14.3" fill="#1b2931"><tspan x="1116" dy="0">Fiabilité et visibilité financière</tspan></text><circle cx="1104" cy="779" r="3.5" fill="#111827"/><text x="1116" y="784" font-size="14.3" fill="#1b2931"><tspan x="1116" dy="0">Identification plus rapide des écarts</tspan></text><circle cx="1104" cy="802" r="3.5" fill="#111827"/><text x="1116" y="807" font-size="14.3" fill="#1b2931"><tspan x="1116" dy="0">Décisions budgétaires mieux éclairées</tspan></text>
<text x="800" y="584" text-anchor="middle" font-size="16.4" font-weight="500" fill="#27323b"><tspan x="800" dy="0">Disposer de résultats financiers fiables</tspan><tspan x="800" dy="22">et consolidés pour repérer les écarts et</tspan><tspan x="800" dy="22">orienter les décisions budgétaires.</tspan></text>
<text x="686" y="712" font-size="20">NAME</text><text x="766" y="712" font-size="19" font-weight="700">Habib (38 ans)</text><path d="M757 719 L969 719" stroke="#222" stroke-width="1.8"/>
<text x="686" y="755" font-size="20">ROLE</text><text x="763" y="750" font-size="14.1" font-weight="700">Directeur administratif</text><text x="763" y="771" font-size="14.1" font-weight="700">et financier (DAF)</text><path d="M757 762 L969 762" stroke="#222" stroke-width="1.8"/>
</g><rect x="55" y="824" width="1490" height="49" fill="#f5f5f5"/><text x="76" y="854" font-size="19" font-family="Arial,sans-serif" font-style="italic" fill="#46505c">Persona de conception — besoins, tendances, craintes et gains supposés, à valider auprès d'utilisateurs.</text></svg>